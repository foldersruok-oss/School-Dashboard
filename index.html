<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schulplaner 26/27</title>
<meta name="description" content="Persönlicher Schulplaner mit Countdown, Terminen, Lernhub und Noten für das Schuljahr 2026/27 (Baden-Württemberg)">
<meta name="theme-color" content="#f2f2f7">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Schule 26/27">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}</style>
<style>
/* Layout concept: iOS-style single column (max 600px), large titles, inset grouped cards,
   translucent bottom tab bar, bottom sheets for detail/edit. One dark "ink" hero card carries the countdown. */
:root{
  --bg:#f2f2f7; --card:#ffffff; --fill:#eeeef3; --fill2:#e3e3ea;
  --fg:#16161a; --fg2:#575763; --fg3:#7d7d89; --line:rgba(60,60,67,.14);
  --accent:#0071e3; --accent-fg:#ffffff; --accent-soft:rgba(0,113,227,.10);
  --glass:rgba(250,250,253,.78); --scrim:rgba(0,0,0,.38);
  --shadow:0 1px 2px rgba(20,20,40,.04),0 8px 24px rgba(20,20,40,.06);
  --ink1:#17181d; --ink2:#262833;
  --c-red:#e0362c; --c-orange:#d97706; --c-amber:#b88400; --c-green:#1f9d55; --c-teal:#0e8fa3;
  --c-blue:#0071e3; --c-indigo:#5b52d6; --c-purple:#9b45c9; --c-pink:#d6336c; --c-gray:#6d6d78;
  --ok:#1f9d55; --warn:#b88400; --hi:#d97706; --bad:#d93025;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
  --r:20px; --tab-h:58px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#1c1c1f; --fill:#2a2a2e; --fill2:#36363b;
    --fg:#f5f5f7; --fg2:#b0b0ba; --fg3:#8c8c97; --line:rgba(235,235,245,.13);
    --accent:#4da3ff; --accent-fg:#001b38; --accent-soft:rgba(77,163,255,.16);
    --glass:rgba(24,24,27,.78); --scrim:rgba(0,0,0,.6);
    --shadow:0 1px 0 rgba(255,255,255,.03) inset;
    --ink1:#22232b; --ink2:#2f313d;
    --c-red:#ff6159; --c-orange:#ffa133; --c-amber:#f2c53d; --c-green:#43d17a; --c-teal:#46cde0;
    --c-blue:#4da3ff; --c-indigo:#8b84ff; --c-purple:#c58bf0; --c-pink:#ff7aa8; --c-gray:#a0a0ab;
    --ok:#43d17a; --warn:#f2c53d; --hi:#ffa133; --bad:#ff6159;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1f; --fill:#2a2a2e; --fill2:#36363b;
  --fg:#f5f5f7; --fg2:#b0b0ba; --fg3:#8c8c97; --line:rgba(235,235,245,.13);
  --accent:#4da3ff; --accent-fg:#001b38; --accent-soft:rgba(77,163,255,.16);
  --glass:rgba(24,24,27,.78); --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset;
  --ink1:#22232b; --ink2:#2f313d;
  --c-red:#ff6159; --c-orange:#ffa133; --c-amber:#f2c53d; --c-green:#43d17a; --c-teal:#46cde0;
  --c-blue:#4da3ff; --c-indigo:#8b84ff; --c-purple:#c58bf0; --c-pink:#ff7aa8; --c-gray:#a0a0ab;
  --ok:#43d17a; --warn:#f2c53d; --hi:#ffa133; --bad:#ff6159;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100%}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
h1,h2,h3,h4,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:1.25em;height:1.25em;flex:none;vertical-align:-.2em}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{max-width:600px;margin:0 auto;padding-inline:16px;padding-block:8px calc(var(--tab-h) + 40px + env(safe-area-inset-bottom,0px))}
#view.enter{animation:enter .28s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stack{display:flex;flex-direction:column;gap:16px}
.screen-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:14px 12px}
.screen-head h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.02em}
.head-actions{display:flex;gap:8px}
.eyebrow{font-size:13px;font-weight:600;color:var(--fg2);letter-spacing:.01em}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:20px;font-weight:700;letter-spacing:-.01em;margin-bottom:10px}
.sec-sub{font-size:14px;font-weight:500;color:var(--fg2)}
.link{color:var(--accent);font-weight:600;font-size:15px;min-height:44px;display:inline-flex;align-items:center;gap:4px}
.muted{color:var(--fg2)}
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--shadow);padding:16px}
.card.flush{padding:0;overflow:hidden}

/* ---------- buttons / fields ---------- */
.icon-btn{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--fill);color:var(--fg);transition:background .15s,transform .1s}
.icon-btn:active{transform:scale(.94)}
.icon-btn.accent{background:var(--accent);color:var(--accent-fg)}
.btn{min-height:48px;padding:0 20px;border-radius:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--fill);color:var(--fg);transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.danger{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.btn.solid-danger{background:var(--bad);color:#fff}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 140px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:13px;font-weight:600;color:var(--fg2);letter-spacing:.02em;text-transform:uppercase}
.inp{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1px solid transparent;background:var(--fill);font-size:16px;min-width:0;appearance:none;-webkit-appearance:none}
textarea.inp{min-height:96px;resize:vertical;line-height:1.45}
select.inp{background-image:none;padding-right:14px}
.inp:focus{outline:2px solid var(--accent);outline-offset:0;background:var(--card)}
.inp[aria-invalid="true"]{border-color:var(--bad)}
input[type=date].inp,input[type=time].inp{min-width:0;text-align:left}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form{display:flex;flex-direction:column;gap:16px}
.err{color:var(--bad);font-size:14px;font-weight:500}
.hint{color:var(--fg2);font-size:14px}

/* chips / segmented / radios */
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:2px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 16px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:6px;color:var(--fg);position:relative}
.chip[aria-pressed="true"],.opt input:checked+.chip{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative;display:inline-flex}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt input:focus-visible+.chip,.opt input:focus-visible+.swatch,.opt input:focus-visible+.icopt{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:12px;padding:3px;gap:2px}
.seg button,.seg label{min-height:40px;border-radius:10px;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--fg2);position:relative;padding:0 6px}
.seg button[aria-pressed="true"],.seg label:has(input:checked){background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg input{position:absolute;opacity:0;inset:0;margin:0;width:100%;height:100%;cursor:pointer}
.seg label:has(input:focus-visible){outline:2px solid var(--accent)}
.swatch{width:36px;height:36px;border-radius:50%;background:var(--sw);border:3px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.opt input:checked+.swatch{box-shadow:0 0 0 2.5px var(--fg)}
.opt{min-width:44px;min-height:44px;align-items:center;justify-content:center}
.icopt{width:44px;height:44px;border-radius:12px;background:var(--fill);display:inline-flex;align-items:center;justify-content:center}
.opt input:checked+.icopt{background:var(--accent);color:var(--accent-fg)}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.switch{position:relative;width:52px;height:32px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.switch i{position:absolute;inset:0;border-radius:16px;background:var(--fill2);transition:background .2s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch input:checked+i{background:var(--ok)}
.switch input:checked+i::after{transform:translateX(20px)}
.switch input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.searchbar{position:relative;margin-bottom:12px}
.searchbar .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--fg3);pointer-events:none}
.searchbar .inp{padding-left:42px;border-radius:14px}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--bc,var(--fg2));background:color-mix(in srgb,var(--bc,var(--fg2)) 15%,transparent);white-space:nowrap}
.badge .ic{width:12px;height:12px}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--pc);background:color-mix(in srgb,var(--pc) 16%,transparent)}
.pill.LOW{--pc:var(--ok)}.pill.MEDIUM{--pc:var(--warn)}.pill.HIGH{--pc:var(--hi)}.pill.URGENT{--pc:var(--bad)}
.bar{height:8px;border-radius:4px;background:var(--fill2);overflow:hidden}
.bar>i{display:block;width:0;height:100%;border-radius:4px;background:var(--bc,var(--accent));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar.slim{height:5px}

/* ---------- home ---------- */
.home-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-block:14px 4px}
.home-head h1{font-size:32px;line-height:1.1;font-weight:700;letter-spacing:-.02em}
.clock-box{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.clock{font:700 22px var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.yearline{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--fg2);margin-block:6px 2px}
.yearline .bar{flex:1}
.hero{position:relative;border-radius:28px;color:#fff;padding:20px 20px 18px;overflow:hidden;background:linear-gradient(155deg,var(--ink2),var(--ink1));border:1px solid rgba(255,255,255,.08);box-shadow:0 10px 30px rgba(10,10,30,.22)}
.hero::before{content:"";position:absolute;right:-60px;top:-80px;width:240px;height:240px;border-radius:50%;background:radial-gradient(closest-side,var(--hc),transparent);opacity:.5;pointer-events:none}
.hero>*{position:relative}
.hero .hit{position:absolute;inset:0;z-index:1;width:100%;border-radius:28px}
.hero .hit:focus-visible{outline:3px solid #fff;outline-offset:-3px}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
.hero-eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.72)}
.hero .badge{--bc:#fff;background:rgba(255,255,255,.16);color:#fff}
.hero .pin{position:relative;z-index:2;width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:rgba(255,255,255,.85);background:rgba(255,255,255,.1)}
.hero .pin[aria-pressed="true"]{background:#fff;color:#16161a}
.hero-title{font-size:30px;line-height:1.1;font-weight:750;letter-spacing:-.025em;margin-top:6px;text-wrap:balance}
.hero-date{margin-top:6px;font-size:16px;color:rgba(255,255,255,.78);font-weight:500}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:20px}
.cd-cell{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:12px 4px 10px;text-align:center;min-width:0}
.cd-cell b{display:block;font:700 clamp(30px,10.5vw,46px)/1 var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cd-cell span{display:block;margin-top:6px;font-size:11px;font-weight:700;letter-spacing:.1em;color:rgba(255,255,255,.7)}
.cd-word{margin-top:16px}
.cd-word .w{font:800 clamp(44px,15vw,68px)/1 var(--font-num);letter-spacing:-.03em}
.cd-word .live{margin-top:8px;font-size:17px;font-weight:600;color:rgba(255,255,255,.82);font-variant-numeric:tabular-nums}
.cd-word .big-unit{margin-top:6px;font-size:13px;font-weight:700;letter-spacing:.1em;color:rgba(255,255,255,.7)}
.hero-foot{display:flex;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap;font-size:14px;color:rgba(255,255,255,.8);font-weight:600}
.hero-foot .bar{flex:1;min-width:80px;background:rgba(255,255,255,.18);--bc:#fff}
.hero .pill{background:rgba(255,255,255,.16);color:#fff}
.hero.empty{padding-block:26px}
.hero.empty h2{font-size:24px;font-weight:700}
.hero.empty p{margin-top:6px;color:rgba(255,255,255,.75)}
.hero.empty .btn{margin-top:14px;background:#fff;color:#16161a}
.list>li+li{border-top:1px solid var(--line)}
.mini{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 16px;width:100%}
.mini .t{flex:1;min-width:0}
.mini .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .t span{display:block;font-size:14px;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .r{font-size:14px;font-weight:600;color:var(--fg2);white-space:nowrap;text-align:right}
.chipic{width:36px;height:36px;border-radius:11px;background:color-mix(in srgb,var(--ec) 16%,transparent);color:var(--ec);display:inline-flex;align-items:center;justify-content:center;flex:none}
.empty-line{padding:18px 16px;color:var(--fg2);display:flex;align-items:center;gap:10px}
.status-line{display:flex;align-items:center;gap:8px;padding:10px 16px;font-size:14px;color:var(--fg2);font-weight:600;border-top:1px solid var(--line)}
.status-line .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.focus-head{display:flex;align-items:flex-start;gap:12px;padding:16px 16px 12px}
.focus-head .t{flex:1;min-width:0}
.focus-head h3{font-size:18px;font-weight:700;letter-spacing:-.01em}
.focus-head p{font-size:14px;color:var(--fg2);margin-top:2px}
.focus-prog{padding:0 16px 12px}
.focus-prog .meta{display:flex;justify-content:space-between;font-size:14px;font-weight:600;color:var(--fg2);margin-bottom:6px}
.task{display:flex;align-items:center;gap:6px;min-height:52px;padding:2px 8px 2px 4px}
.task .tx{flex:1;min-width:0;padding-block:8px}
.task .tx b{display:block;font-weight:500;overflow-wrap:anywhere}
.task .tx span{display:block;font-size:13px;color:var(--fg2)}
.task.done .tx b{text-decoration:line-through;color:var(--fg3)}
.task .due.over{color:var(--bad);font-weight:600}
.cbtn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;flex:none;border-radius:50%}
.cbox{width:26px;height:26px;border-radius:50%;border:2px solid var(--fg3);display:inline-flex;align-items:center;justify-content:center;color:transparent;transition:background .18s,border-color .18s}
.cbox .ic{width:15px;height:15px;stroke-width:3}
[aria-pressed="true"]>.cbox,.cbox.on{background:var(--ok);border-color:var(--ok);color:#fff}
.pop .cbox{animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
.next-row{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 16px;width:100%}
.datebox{width:46px;flex:none;text-align:center;line-height:1.05}
.datebox b{display:block;font:700 21px var(--font-num);font-variant-numeric:tabular-nums}
.datebox i{display:block;font-style:normal;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--ec,var(--fg2));text-transform:uppercase;margin-top:2px}

/* ---------- timeline ---------- */
.month-h{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;display:flex;justify-content:space-between;align-items:baseline;padding:10px 4px 6px;margin-inline:-4px;font-size:15px;font-weight:700;color:var(--fg2);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tl-group{margin-bottom:10px}
.ev-row{display:flex;align-items:stretch;position:relative}
.ev-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 4px 8px 16px}
.ev-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ev-title{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.ev-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--fg2)}
.ev-rel{font-size:13px;font-weight:600;color:var(--fg2);white-space:nowrap;text-align:right;max-width:92px}
.ev-row.past .ev-main{opacity:.5}
.ev-row.past .ev-title{font-weight:500}
.ev-row.is-today{background:var(--accent-soft)}
.ev-row.is-today .ev-rel{color:var(--accent)}
.ev-row.done .ev-title{text-decoration:line-through}
.today-line{display:flex;align-items:center;gap:10px;padding:8px 16px;font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft)}
.today-line::before,.today-line::after{content:"";height:1px;flex:1;background:var(--accent);opacity:.4}
.filters-panel{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.count-line{font-size:13px;color:var(--fg2);font-weight:600;margin:12px 4px 2px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:36px 20px;color:var(--fg2)}
.empty .em-ic{width:56px;height:56px;border-radius:18px;background:var(--fill);display:flex;align-items:center;justify-content:center;color:var(--fg2)}
.empty .em-ic .ic{width:26px;height:26px}
.empty h3{font-size:18px;color:var(--fg);font-weight:700}

/* ---------- exam cards / subjects / grades ---------- */
.exam-card{display:block;width:100%;padding:16px;text-align:left}
.exam-card+.exam-card{border-top:1px solid var(--line)}
.exam-top{display:flex;align-items:flex-start;gap:12px}
.exam-top .t{flex:1;min-width:0}
.exam-top h3{font-size:17px;font-weight:700;overflow-wrap:anywhere}
.exam-top p{font-size:14px;color:var(--fg2);margin-top:2px}
.exam-days{text-align:right;flex:none}
.exam-days b{display:block;font:700 26px/1 var(--font-num);font-variant-numeric:tabular-nums}
.exam-days span{font-size:12px;font-weight:700;color:var(--fg2);letter-spacing:.06em}
.exam-prog{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13px;font-weight:600;color:var(--fg2)}
.exam-prog .bar{flex:1}
.subj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.subj-card{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);width:100%;min-width:0;text-align:left}
.subj-card h3{font-size:17px;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.subj-avg{font:700 30px/1 var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.subj-card .sm{font-size:13px;color:var(--fg2);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-ok{color:var(--ok)}.g-mid{color:var(--warn)}.g-hi{color:var(--hi)}.g-bad{color:var(--bad)}.g-none{color:var(--fg3)}
.overall{padding:20px;display:flex;flex-direction:column;gap:14px}
.overall .big{font:750 56px/1 var(--font-num);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--fill);border-radius:14px;padding:10px 8px;text-align:center;min-width:0}
.stat b{display:block;font:700 20px var(--font-num);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;font-weight:600;color:var(--fg2)}
.grow-row{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 16px;width:100%}
.gbadge{min-width:46px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font:700 18px var(--font-num);font-variant-numeric:tabular-nums;background:color-mix(in srgb,currentColor 14%,transparent);flex:none}
.type-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.type-chips .badge{--bc:var(--fg2)}
.calc-result{border-radius:18px;padding:18px;background:var(--accent-soft);color:var(--fg)}
.calc-result.bad{background:color-mix(in srgb,var(--bad) 13%,transparent)}
.calc-result.good{background:color-mix(in srgb,var(--ok) 14%,transparent)}
.calc-result .big{font:750 22px/1.25 var(--font-num);letter-spacing:-.01em;text-wrap:balance}
.calc-result p{margin-top:6px;font-size:14px;color:var(--fg2)}
.explain{font-size:14px;line-height:1.55;background:var(--fill);border-radius:14px;padding:14px;overflow-wrap:anywhere}
.explain code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}

/* ---------- grouped settings ---------- */
.group{background:var(--card);border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.group-title{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--fg2);margin:8px 8px 8px}
.set-row{display:flex;align-items:center;gap:12px;min-height:54px;padding:8px 16px;width:100%}
.set-row+.set-row{border-top:1px solid var(--line)}
.set-row .t{flex:1;min-width:0}
.set-row .t b{display:block;font-weight:600}
.set-row .t span{display:block;font-size:14px;color:var(--fg2)}
.set-row .ic.chev{color:var(--fg3);width:1.1em}
.set-pad{padding:14px 16px}
.set-pad+.set-pad{border-top:1px solid var(--line)}
.w-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:14px 16px}
.meter{height:8px;border-radius:4px;background:var(--fill2);overflow:hidden}
.meter>i{display:block;height:100%;background:var(--ok)}
.meter.warn>i{background:var(--warn)}.meter.crit>i{background:var(--bad)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--warn) 16%,transparent);font-size:14px;font-weight:500;margin-bottom:12px}
.banner.bad{background:color-mix(in srgb,var(--bad) 14%,transparent)}
.banner .ic{margin-top:2px}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--glass);backdrop-filter:saturate(1.8) blur(22px);-webkit-backdrop-filter:saturate(1.8) blur(22px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar ul{display:grid;grid-template-columns:repeat(5,1fr);max-width:600px;margin:0 auto;padding-inline:8px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:var(--tab-h);width:100%;font-size:11px;font-weight:600;color:var(--fg3);letter-spacing:.01em}
.tab .ic{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}

/* ---------- sheets / dialogs / toast ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:transparent;display:flex;align-items:flex-end;justify-content:center;transition:background .25s}
.scrim.open{background:var(--scrim)}
.sheet{width:100%;max-width:640px;max-height:min(94%,100dvh - 12px);height:auto;display:flex;flex-direction:column;background:var(--bg);border-radius:26px 26px 0 0;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.25);overscroll-behavior:contain;padding-bottom:env(safe-area-inset-bottom,0px)}
.scrim.open .sheet{transform:none}
.sheet.tall{height:min(94%,100dvh - 12px)}
.grab{flex:none;height:22px;display:flex;align-items:center;justify-content:center;touch-action:none}
.grab::before{content:"";width:40px;height:5px;border-radius:3px;background:var(--fill2)}
.sheet-head{flex:none;display:flex;align-items:center;gap:8px;padding:0 12px 8px;touch-action:none}
.sheet-head h2{flex:1;min-width:0;font-size:18px;font-weight:700;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-head .icon-btn,.sheet-head .sp{width:44px;flex:none}
.sheet-actions{display:flex;gap:6px}
.sheet-body{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:4px 16px 24px;min-height:0}
.dlg-scrim{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .2s}
.dlg-scrim.open{opacity:1}
.dlg{width:100%;max-width:400px;background:var(--card);border-radius:24px;padding:22px 20px 16px;box-shadow:0 20px 60px rgba(0,0,0,.35);transform:scale(.96);transition:transform .2s}
.dlg-scrim.open .dlg{transform:none}
.dlg h3{font-size:19px;font-weight:700}
.dlg p{margin-top:8px;color:var(--fg2);font-size:15px}
.dlg .btn-row{margin-top:18px}
.toasts{position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + 14px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding-inline:16px}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;max-width:440px;background:var(--ink1);color:#fff;padding:6px 8px 6px 16px;border-radius:16px;font-size:15px;font-weight:500;box-shadow:0 8px 30px rgba(0,0,0,.3);animation:enter .25s}
.toast button{min-height:44px;padding:0 12px;color:#8fc2ff;font-weight:700}
.viewer{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 12px env(safe-area-inset-bottom,0px)}
.viewer img{max-width:100%;max-height:86%;object-fit:contain;border-radius:8px}
.viewer .icon-btn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;background:rgba(255,255,255,.18);color:#fff}

/* ---------- hub (exam detail) ---------- */
.hub-head{display:flex;flex-direction:column;gap:6px;padding-block:4px 6px}
.hub-head h3{font-size:26px;font-weight:750;letter-spacing:-.02em;line-height:1.15;overflow-wrap:anywhere}
.hub-count{display:flex;align-items:baseline;gap:8px;margin-top:2px}
.hub-count b{font:750 44px/1 var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.hub-count span{font-size:15px;font-weight:600;color:var(--fg2)}
.act-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:60px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--fg);padding:6px 2px;min-width:0}
.act .ic{width:20px;height:20px}
.act.danger{color:var(--bad)}
.act[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.sec{display:flex;flex-direction:column;gap:10px}
.sec>h4{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--fg2);display:flex;justify-content:space-between;align-items:center;gap:8px}
.prog-big{display:flex;align-items:center;gap:14px}
.prog-big .pct{font:750 34px/1 var(--font-num);font-variant-numeric:tabular-nums;min-width:96px}
.prog-big .bar{flex:1;height:12px;border-radius:6px}
.prog-big .bar>i{border-radius:6px}
.add-task{display:flex;gap:8px;align-items:center}
.add-task .inp{flex:1}
.edit-task{display:flex;flex-direction:column;gap:8px;padding:10px 12px}
.notes-wrap{display:flex;flex-direction:column;gap:8px}
.preview{min-height:96px;padding:12px 14px;border-radius:12px;background:var(--fill);overflow-wrap:anywhere}
.preview h1,.preview h2,.preview h3{font-size:17px;margin:8px 0 4px}
.preview ul{list-style:disc;padding-left:20px}
.preview code{background:var(--fill2);padding:1px 5px;border-radius:5px;font-size:13px}
.preview p+p{margin-top:6px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.thumb{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--fill)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:4px;right:4px;width:44px;height:44px;display:flex;align-items:flex-start;justify-content:flex-end}
.thumb .x span{width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center}
.thumb .x .ic{width:14px;height:14px}
.thumb .open{position:absolute;inset:0;width:100%}
.addimg{aspect-ratio:1;border-radius:14px;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--fg2);font-size:13px;font-weight:600;cursor:pointer;position:relative}
.addimg input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.results h4{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--fg2);margin:14px 4px 6px}
.results mark{background:color-mix(in srgb,var(--c-amber) 35%,transparent);color:inherit;border-radius:3px;padding:0 1px}
pre.json{max-height:200px;overflow:auto;background:var(--fill);border-radius:12px;padding:12px;font-size:12px;white-space:pre-wrap;word-break:break-all;margin:0}

@media (min-width:700px){
  .scrim{align-items:center}
  .sheet{border-radius:26px;transform:translateY(24px);opacity:0;transition:transform .3s,opacity .2s}
  .scrim.open .sheet{opacity:1}
  .sheet.tall{height:min(88%,860px)}
  .grab{display:none}
  .sheet-head{padding-top:14px}
}
@media (max-width:380px){
  .screen-head h1{font-size:30px}
  .act span{font-size:11px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}

</style>
</head>

const str = (v, max = 400) => (typeof v === 'string' ? v : v == null ? '' : String(v)).slice(0, max);

    id: str(r.id, 60) || uid(), seed: r.seed === true, title, date: r.date, endDate: end,
    time: isTime(r.time) ? r.time : '', subject: canon(str(r.subject, 60)), category: CATS[r.category] ? r.category : 'Event',
    description: str(r.description, 4000), priority: PRIORITIES.includes(r.priority) ? r.priority : 'normal',

    date: isDateKey(r.date) ? r.date : todayKey(), weight: isNum(w) && w > 0 && w <= 100 ? w : 1, note: str(r.note, 300) };

  if (!r || typeof r !== 'object' || typeof r.data !== 'string' || !r.data.startsWith('data:image/') || !r.eventId) return null;

/* ---------- storage ---------- */
let S = null;            // main state
let ATT = [];            // attachments
let storageOK = true;    // false when localStorage is unavailable or full
let locked = false;      // true when stored data comes from a newer app version (we never overwrite it)
const loadInfo = { corrupt: false, dropped: 0, newer: false, first: false };
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { storageOK = false; return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }
function loadAll() {
  const raw = lsGet(CONFIG.KEY);
  if (raw == null) {
    S = freshState(); loadInfo.first = true;
    if (!persist()) storageOK = false;
  } else {
    let obj = null;
    try { obj = JSON.parse(raw); } catch (e) { obj = null; }
    if (!obj || typeof obj !== 'object' || Array.isArray(obj)) {
      lsSet(CONFIG.BAD_KEY, raw); loadInfo.corrupt = true;
      S = freshState(); persist();
    } else {
      if (isNum(obj.schema) && obj.schema > CONFIG.SCHEMA) { locked = true; loadInfo.newer = true; }
      S = sanitizeState(migrate(obj));
      loadInfo.dropped = S.dropped || 0;
      delete S.dropped;
    }
  }
  const ar = lsGet(CONFIG.ATT_KEY);
  ATT = [];
  if (ar) { try { const a = JSON.parse(ar); if (Array.isArray(a)) for (const r of a) { const n = normAtt(r); if (n && S.events.some(e => e.id === n.eventId)) ATT.push(n); } } catch (e) { lsSet(CONFIG.BAD_KEY + '.att', ar); } }
}
function persist() {
  if (locked) return false;
  const ok = lsSet(CONFIG.KEY, JSON.stringify(S));
  if (!ok) storageOK = false;
  return ok;
}
function persistAtt() { if (locked) return false; return lsSet(CONFIG.ATT_KEY, JSON.stringify(ATT)); }
function storageUsage() {
  let chars = 0;
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith('schulplaner')) chars += k.length + (localStorage.getItem(k) || '').length; } } catch (e) { /* ignore */ }
  const attChars = JSON.stringify(ATT).length;
  return { chars, attChars, ratio: chars / CONFIG.STORAGE_LIMIT, mb: chars * 2 / 1e6 };
}

/* ---------- event helpers ---------- */
const endOf = e => e.endDate || e.date;
const catRank = c => { const i = CONFIG.CATEGORY_ORDER.indexOf(c); return i < 0 ? 99 : i; };
const byStart = (a, b) => a.date.localeCompare(b.date) || (a.time || '').localeCompare(b.time || '') || catRank(a.category) - catRank(b.category) || a.title.localeCompare(b.title, 'de');
const isExam = e => !!(e && CATS[e.category] && CATS[e.category].exam);
const evColor = e => 'var(--c-' + (e.color || CATS[e.category].color) + ')';
const evIcon = e => e.icon || CATS[e.category].icon;
const isPast = (e, today) => endOf(e) < today;
const isNow = (e, today) => e.date <= today && endOf(e) >= today;
const startTs = e => berlinTs(e.date, e.time || '00:00');
function relLabel(e, today) {
  if (isNow(e, today)) {
    if (e.endDate) { const n = dayDiff(today, e.endDate) + 1; return n === 1 ? 'Letzter Tag' : `noch ${n} Tage`; }
    return 'Heute';
  }
  const d = dayDiff(today, e.date);
  if (d === 1) return 'Morgen';
  if (d > 1) return `in ${d} Tagen`;
  const p = dayDiff(endOf(e), today);
  return p === 1 ? 'Gestern' : `vor ${p} Tagen`;
}
function pickHero(today) {
  const open = S.events.filter(e => !e.completed && endOf(e) >= today);
  const pin = S.settings.pinnedId && S.events.find(e => e.id === S.settings.pinnedId);
  if (pin && endOf(pin) >= today) return { ev: pin, pinned: true };
  for (const g of CONFIG.HERO_GROUPS) {
    const c = open.filter(e => g.includes(e.category)).sort(byStart);
    if (c.length) return { ev: c[0], pinned: false };
  }
  return null;
}
const tasksOf = id => S.tasks.filter(t => t.eventId === id);
function progressOf(id) {
  const t = tasksOf(id); const done = t.filter(x => x.done).length;
  return { total: t.length, done, open: t.length - done, pct: t.length ? Math.round(done / t.length * 100) : 0 };
}

  if (!isExam(e) || e.completed || isPast(e, today)) return null;
  const days = dayDiff(today, e.date), p = progressOf(e.id).pct;
  for (const [lvl, maxD, minP] of CONFIG.URGENCY_RULES) if (days <= maxD && p < minP) return lvl;

/* ---------- grades ---------- */
function parseNum(s) {
  if (typeof s === 'number') return isFinite(s) ? s : NaN;
  const t = String(s ?? '').trim().replace(',', '.');
  return /^-?\d+(\.\d+)?$/.test(t) ? parseFloat(t) : NaN;
}
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : NaN;
function wmean(items) { const sw = items.reduce((s, i) => s + i.w, 0); return sw > 0 ? items.reduce((s, i) => s + i.v * i.w, 0) / sw : NaN; }
function allSubjects() {
  const set = new Set(CONFIG.DEFAULT_SUBJECTS);
  S.subjects.forEach(s => set.add(s));
  S.events.forEach(e => e.subject && set.add(e.subject));
  S.grades.forEach(g => set.add(g.subject));
  return [...set];
}
/* Weighted subject average: grades of one type are averaged using their own weights, then the type averages are
   combined with the type weights from the settings (only types that actually have grades take part). */
function subjectStats(name) {
  const key = canon(name);
  const gs = S.grades.filter(g => g.subject === key);
  if (!gs.length) return { name: key, count: 0, plain: NaN, weighted: NaN, best: NaN, worst: NaN, byType: {}, knownPct: 0, grades: [] };
  const groups = {};
  for (const g of gs) (groups[g.type] = groups[g.type] || []).push(g);
  const W = S.settings.weights; const bt = {}; let num = 0, den = 0;
  for (const [t, arr] of Object.entries(groups)) {
    const avg = wmean(arr.map(g => ({ v: g.grade, w: g.weight })));
    bt[t] = { avg, count: arr.length };
    const tw = W[t] || 0;
    if (tw > 0) { num += avg * tw; den += tw; }
  }
  const totalW = GRADE_TYPES.reduce((s, t) => s + (W[t] || 0), 0);
  const weighted = den > 0 ? num / den : wmean(gs.map(g => ({ v: g.grade, w: g.weight })));
  return { name: key, count: gs.length, plain: mean(gs.map(g => g.grade)), weighted, best: Math.min(...gs.map(g => g.grade)), worst: Math.max(...gs.map(g => g.grade)), byType: bt, knownPct: totalW > 0 ? Math.round(den / totalW * 100) : 0, grades: gs };
}
function overallStats() {
  const subs = allSubjects().map(subjectStats).filter(s => s.count);
  const all = S.grades.map(g => g.grade);
  return { count: all.length, subjects: subs.length, weighted: mean(subs.map(s => s.weighted)), plain: mean(subs.map(s => s.plain)), best: all.length ? Math.min(...all) : NaN, worst: all.length ? Math.max(...all) : NaN };
}
const gradeClass = g => !isNum(g) ? 'g-none' : g < 2.5 ? 'g-ok' : g < 3.5 ? 'g-mid' : g < 4.5 ? 'g-hi' : 'g-bad';
/* Required grade x so that (A*W + x*w) / (W + w) = T. A=current avg, W=weight already counted, w=weight of next assessment */
function targetCalc(A, W, T, w) {
  const x = (T * (W + w) - A * W) / w;
  const EPS = 1e-9;
  if (x < 1 - EPS) return { kind: 'impossible', x, best: (A * W + 1 * w) / (W + w) };
  if (x > 6 + EPS) return { kind: 'safe', x, worst: (A * W + 6 * w) / (W + w) };
  const shown = Math.max(1, Math.floor((x + EPS) * 10) / 10);
  return { kind: 'ok', x, shown };

const VIEWS = {};            // filled in 03-views.js
const sheetStack = [];
const barCache = new Map();

/* ---------- theme ---------- */
function applyTheme() {
  const t = S && S.settings ? S.settings.theme : 'system';
  const r = document.documentElement;
  if (t === 'light' || t === 'dark') r.setAttribute('data-theme', t); else r.removeAttribute('data-theme');
  try { localStorage.setItem('schulplaner.theme', t); } catch (e) { /* ignore */ }
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) { const bg = getComputedStyle(r).getPropertyValue('--bg').trim(); if (bg) meta.setAttribute('content', bg); }
}

/* ---------- render loop ---------- */
function render(enter) {
  const v = $('#view'); if (!v || !S) return;
  const ae = document.activeElement;
  const fid = ae && v.contains(ae) ? ae.id : '';
  const sel = fid && ae.setSelectionRange && /text|search|number|tel/.test(ae.type || '') ? [ae.selectionStart, ae.selectionEnd] : null;
  const sy = window.scrollY;
  try { v.innerHTML = VIEWS[UI.tab](); } catch (err) { console.error(err); v.innerHTML = `<div class="empty"><h3>Das hat nicht geklappt</h3><p>Diese Ansicht konnte nicht geladen werden. Deine Daten sind sicher.</p></div>`; }
  if (enter) { v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter'); window.scrollTo(0, 0); } else window.scrollTo(0, sy);
  postRender(v);
  if (fid) { const el = document.getElementById(fid); if (el) { try { el.focus({ preventScroll: true }); if (sel && el.setSelectionRange) el.setSelectionRange(sel[0], sel[1]); } catch (e) { /* ignore */ } } }
  $$('.tab').forEach(b => { if (b.dataset.tab === UI.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
}
function postRender(root) {
  $$('[data-bar]', root).forEach(el => {
    const to = el.dataset.bar, k = el.dataset.bk;
    const from = k && barCache.has(k) ? barCache.get(k) : to;
    el.style.width = from + '%';
    void el.offsetWidth;
    el.style.width = to + '%';
    if (k) barCache.set(k, to);
  });
}
function commit() {
  persist();
  render();
  refreshSheets();
  if (!storageOK && !commit._warned) { commit._warned = true; toast('Speichern im Browser ist nicht möglich. Erstelle regelmäßig ein Backup unter „Mehr“.'); }
}

/* ---------- sheets ---------- */
function syncInert() {
  const top = sheetStack[sheetStack.length - 1];
  const any = sheetStack.length > 0;
  const app = $('#app'), tabs = $('#tabbar');
  if (app) app.inert = any; if (tabs) tabs.inert = any;
  sheetStack.forEach(r => { r.el.inert = r !== top; });

}
function openSheet(o) {
  const el = document.createElement('div');
  el.className = 'scrim';
  el.innerHTML = `<div class="sheet ${o.tall ? 'tall' : ''}" role="dialog" aria-modal="true" tabindex="-1">
    <div class="grab"></div>
    <div class="sheet-head"><button class="icon-btn" data-act="close-sheet" aria-label="Schließen">${icon('x')}</button><h2></h2><div class="sheet-actions" style="min-width:44px;justify-content:flex-end"></div></div>
    <div class="sheet-body"></div></div>`;
  const rec = { el, sheet: el.firstElementChild, body: $('.sheet-body', el), head: $('h2', el), actions: $('.sheet-actions', el), o, opener: document.activeElement };
  rec.setTitle = t => { rec.head.textContent = t; rec.sheet.setAttribute('aria-label', t); };
  el.addEventListener('mousedown', e => { if (e.target === el) closeSheet(rec); });

  sheetStack.push(rec);
  syncInert();

}
function closeSheet(rec) {
  rec = rec || sheetStack[sheetStack.length - 1];
  if (!rec) return;
  const i = sheetStack.indexOf(rec); if (i < 0) return;
  sheetStack.splice(i, 1);
  rec.el.classList.remove('open');
  syncInert();
  setTimeout(() => rec.el.remove(), 320);
  if (rec.o.onClose) rec.o.onClose();
  if (rec.o.afterClose) rec.o.afterClose();
  const op = rec.opener;
  setTimeout(() => { try { if (op && op.isConnected && !sheetStack.length) op.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }, 50);
}
function closeAllSheets() { while (sheetStack.length) closeSheet(); }
function refreshSheets() {
  for (const rec of sheetStack.slice()) {
    if (rec.o.static) continue;
    const ae = document.activeElement;
    const fid = ae && rec.el.contains(ae) ? ae.id : '';
    const sel = fid && ae.setSelectionRange && /text|search|number/.test(ae.type || '') ? [ae.selectionStart, ae.selectionEnd] : null;
    const sy = rec.body.scrollTop;
    if (rec.o.build(rec) === false) { closeSheet(rec); continue; }
    rec.body.scrollTop = sy;
    postRender(rec.body);
    if (fid) { const el = document.getElementById(fid); if (el) { try { el.focus({ preventScroll: true }); if (sel && el.setSelectionRange) el.setSelectionRange(sel[0], sel[1]); } catch (e) { /* ignore */ } } }

}
function attachSwipe(rec) {
  let y0 = null, dy = 0;
  const zone = [$('.grab', rec.el), $('.sheet-head', rec.el)];
  const sh = rec.sheet;
  zone.forEach(z => {
    z.addEventListener('touchstart', e => { if (e.target.closest('button')) return; y0 = e.touches[0].clientY; dy = 0; sh.style.transition = 'none'; }, { passive: true });
    z.addEventListener('touchmove', e => { if (y0 == null) return; dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transform = `translateY(${dy}px)`; }, { passive: true });
    const end = () => { if (y0 == null) return; y0 = null; sh.style.transition = ''; if (dy > 110) { sh.style.transform = ''; closeSheet(rec); } else sh.style.transform = ''; };
    z.addEventListener('touchend', end); z.addEventListener('touchcancel', end);
  });
}

function confirmBox({ title, text, ok = 'Bestätigen', danger = false, typed = '', cancel = 'Abbrechen' }) {
  return new Promise(res => {
    const prev = document.activeElement;
    const el = document.createElement('div');
    el.className = 'dlg-scrim';
    el.innerHTML = `<div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t" aria-describedby="dlg-d">
      <h3 id="dlg-t">${esc(title)}</h3><p id="dlg-d">${esc(text || '')}</p>
      ${typed ? `<div class="field" style="margin-top:14px"><label for="dlg-in">Zum Bestätigen „${esc(typed)}“ eintippen</label><input class="inp" id="dlg-in" autocomplete="off" autocapitalize="characters" spellcheck="false"></div>` : ''}
      <div class="btn-row"><button class="btn" data-r="0">${esc(cancel)}</button><button class="btn ${danger ? 'solid-danger' : 'primary'}" data-r="1" ${typed ? 'disabled' : ''}>${esc(ok)}</button></div></div>`;
    const done = v => { el.classList.remove('open'); setTimeout(() => el.remove(), 200); document.removeEventListener('keydown', onKey, true); try { prev && prev.isConnected && prev.focus({ preventScroll: true }); } catch (e) { /* ignore */ } res(v); };
    const onKey = e => {
      if (e.key === 'Escape') { e.stopPropagation(); done(false); }
      else if (e.key === 'Tab') { const f = $$('button:not([disabled]),input', el); if (!f.length) return; const i = f.indexOf(document.activeElement); const n = e.shiftKey ? (i <= 0 ? f.length - 1 : i - 1) : (i === f.length - 1 ? 0 : i + 1); e.preventDefault(); f[n].focus(); }
    };
    document.addEventListener('keydown', onKey, true);
    el.addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (b) { if (b.disabled) return; done(b.dataset.r === '1'); } else if (e.target === el) done(false); });
    $('#layers').appendChild(el);
    const inp = $('#dlg-in', el), okb = $('[data-r="1"]', el);
    if (inp) inp.addEventListener('input', () => { okb.disabled = inp.value.trim().toUpperCase() !== typed.toUpperCase(); });
    requestAnimationFrame(() => { el.classList.add('open'); (inp || $('[data-r="0"]', el)).focus(); });
  });
}
function toast(msg, undo) {
  const box = $('#toasts'); if (!box) return;
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button">Rückgängig</button>' : ''}`;
  const kill = () => { if (t.isConnected) t.remove(); };
  if (undo) $('button', t).addEventListener('click', () => { kill(); undo(); });
  box.appendChild(t);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(kill, undo ? 6500 : 4200);
}
function openViewer(src) {
  const v = document.createElement('div');
  v.className = 'viewer';
  v.setAttribute('role', 'dialog'); v.setAttribute('aria-label', 'Bildansicht');
  v.innerHTML = `<img alt="Angehängtes Bild" src="${src}"><button class="icon-btn" aria-label="Schließen">${icon('x')}</button>`;
  const close = () => { v.remove(); document.removeEventListener('keydown', onKey, true); };

}

/* very small Markdown: headings, **bold**, *italic*, `code`, - lists, - [ ] checkboxes */
function md(src) {
  const inl = s => s.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
  let html = '', list = false;
  for (const raw of esc(src).split('\n')) {
    let l = raw;
    const li = l.match(/^\s*[-*]\s+(.*)$/);
    if (li) { if (!list) { html += '<ul>'; list = true; } let c = li[1]; c = c.replace(/^\[ \]\s*/, '☐ ').replace(/^\[[xX]\]\s*/, '☑ '); html += '<li>' + inl(c) + '</li>'; continue; }
    if (list) { html += '</ul>'; list = false; }
    const h = l.match(/^(#{1,3})\s+(.*)$/);
    if (h) { html += `<h${h[1].length}>${inl(h[2])}</h${h[1].length}>`; continue; }
    if (!l.trim()) continue;
    html += '<p>' + inl(l) + '</p>';
  }
  if (list) html += '</ul>';
  return html || '<p class="muted">Noch nichts notiert.</p>';
}

function greeting() { const h = berlinParts(NOW()).hour; return h < 5 ? 'Gute Nacht' : h < 11 ? 'Guten Morgen' : h < 18 ? 'Guten Tag' : 'Guten Abend'; }

/* ---------- TERMINE ---------- */
function filteredEvents(today) {
  const f = UI.filters, q = f.q.trim().toLowerCase();
  let a = S.events.filter(e => {
    if (f.cat && e.category !== f.cat) return false;
    if (f.subj && e.subject !== f.subj) return false;
    if (f.status === 'upcoming' && (isPast(e, today) || e.completed)) return false;
    if (f.status === 'past' && !isPast(e, today)) return false;
    if (f.status === 'done' && !e.completed) return false;
    if (f.from && endOf(e) < f.from) return false;
    if (f.to && e.date > f.to) return false;
    if (q) { const hay = `${e.title} ${e.subject} ${e.category} ${e.description} ${fmtShort(e.date)} ${fmtFull(e.date)} ${fmtDots(e.date)}`.toLowerCase(); if (!hay.includes(q)) return false; }
    return true;
  }).sort(byStart);
  if (f.status === 'past') a.reverse();
  return a;
}
function evRow(e, today) {

function timelineList() {

      html += `<section class="tl-group"><h3 class="month-h"><span>${MONTHS[+m.slice(5) - 1]} ${m.slice(0, 4)}</span><span>${n}</span></h3><ul class="card flush list">`; open = true;

}

function examCard(e, today) {

  const d = dayDiff(today, e.date);
  const big = past ? '✓' : isNow(e, today) ? 'JETZT' : d === 1 ? '1' : String(d);
  const unit = past ? 'VORBEI' : isNow(e, today) ? '' : d === 1 ? 'TAG' : 'TAGE';
  return `<li><button class="exam-card" data-act="open-event" data-id="${e.id}" style="${past ? 'opacity:.55' : ''}">
    <span class="exam-top"><span class="chipic" style="--ec:${evColor(e)}">${icon(evIcon(e))}</span>
    <span class="t"><h3>${esc(e.title)}</h3><p>${[e.subject, fmtMid(e.date) + (e.endDate ? ' – ' + fmtMid(e.endDate) : '')].filter(Boolean).map(esc).join(' · ')}</p></span>
    <span class="exam-days"><b>${big}</b><span>${unit}</span></span></span>
    <span class="exam-prog">${urgPill(u)}${barHTML(p.pct, 'exam-' + e.id)}<span class="tnum">${p.total ? `${p.done}/${p.total}` : 'keine Aufgaben'}</span></span></button></li>`;
}
function subjectsGrid(today) {
  const subs = allSubjects();
  return `<div class="subj-grid">${subs.map(s => {
    const st = subjectStats(s);
    const next = S.events.filter(e => isExam(e) && e.subject === s && !e.completed && endOf(e) >= today).sort(byStart);
    const ne = next[0];
    const prog = next.length ? Math.round(mean(next.map(e => progressOf(e.id).pct))) : null;
    return `<button class="subj-card" data-act="open-subject" data-v="${esc(s)}"><h3><span>${esc(s)}</span>${icon('chevron-right')}</h3>
      <div class="subj-avg ${gradeClass(st.weighted)}">${fmtNum(st.weighted)}</div>

}
VIEWS.lernen = function () {
  const today = todayKey(), L = UI.lernen;
  const seg = [['exams', 'Prüfungen'], ['tasks', 'Aufgaben'], ['subjects', 'Fächer']];
  let body = '';

    const up = S.events.filter(e => isExam(e) && !e.completed && endOf(e) >= today).sort(byStart);

    if (past.length) body += `<div style="margin-top:16px"><button class="link" data-act="toggle-past" aria-expanded="${UI.showPast}">${icon(UI.showPast ? 'chevron-down' : 'chevron-right')}Vergangen &amp; erledigt (${past.length})</button>${UI.showPast ? `<ul class="card flush list" style="margin-top:8px">${past.map(e => examCard(e, today)).join('')}</ul>` : ''}</div>`;
  } else if (L === 'tasks') {

/* =====================================================================
   SHEETS: event detail / exam hub, event form, grades, subjects,

/* ---------- event detail + exam hub ---------- */
function openEventSheet(id, o = {}) {
  return openSheet({ title: 'Termin', tall: true, eventId: id, build: rec => buildEventSheet(rec, id), onClose: () => { flushNotes(); } });
}
function countdownText(ts) {
  const d = ts - NOW(); if (d <= 0) return '';
  const D = Math.floor(d / 864e5), H = Math.floor(d % 864e5 / 36e5), M = Math.floor(d % 36e5 / 6e4), Sx = Math.floor(d % 6e4 / 1e3);
  return `${D} T · ${pad(H)} Std · ${pad(M)} Min · ${pad(Sx)} Sek`;
}
function buildEventSheet(rec, id) {
  const e = S.events.find(x => x.id === id);
  if (!e) return false;
  const today = todayKey(), exam = isExam(e), past = isPast(e, today), running = isNow(e, today);
  rec.setTitle(exam ? 'Prüfung' : e.category);
  const pinned = S.settings.pinnedId === e.id;
  rec.actions.innerHTML = `<button class="icon-btn" data-act="pin" data-id="${e.id}" aria-pressed="${pinned}" aria-label="${pinned ? 'Nicht mehr anheften' : 'Auf Startseite anheften'}" ${pinned ? 'style="background:var(--accent);color:var(--accent-fg)"' : ''}>${icon(pinned ? 'pin-off' : 'pin')}</button>`;
  let big, unit, live = '';
  if (past) { big = '✓'; unit = e.endDate ? 'Zeitraum vorbei' : 'Vorbei'; }
  else if (running) {
    if (e.endDate) { const n = dayDiff(today, e.endDate) + 1; big = n; unit = `${n === 1 ? 'Tag' : 'Tage'} verbleibend · bis ${fmtMid(e.endDate)}`; } else { big = 'Heute'; unit = e.time ? e.time + ' Uhr' : ''; }
  } else {
    const d = dayDiff(today, e.date); big = d; unit = d === 1 ? 'Kalendertag bis zum Termin' : 'Kalendertage bis zum Termin';
    live = `<p class="hint tnum" data-until="${startTs(e)}">${countdownText(startTs(e))}</p>`;
  }
  const dateLine = e.endDate ? fmtRange(e.date, e.endDate) : fmtLong(e.date);
  const p = progressOf(e.id), u = urgencyOf(e, today);
  const atts = ATT.filter(a => a.eventId === e.id);

  if (end && end < date) return bad('Das Enddatum liegt vor dem Startdatum.', $('#f-end', form));
  if (time && !isTime(time)) return bad('Die Uhrzeit ist ungültig.', $('#f-time', form));
  const data = normEvent({ id: id || uid(), seed: id ? (S.events.find(x => x.id === id) || {}).seed : false, title, date, endDate: end, time, subject: val('subject'), category: val('category'), description: String(fd.get('description') || '').trim(), priority: val('priority'), color: val('color'), icon: val('icon'), completed: fd.get('completed') === 'on' });
  if (!data) return bad('Die Eingaben sind unvollständig.');
  if (id) { const i = S.events.findIndex(x => x.id === id); if (i >= 0) S.events[i] = data; } else S.events.push(data);
  closeSheet();
  commit();
  toast(id ? 'Termin gespeichert' : 'Termin hinzugefügt');
  return data;
}
async function deleteEvent(id) {
  const e = S.events.find(x => x.id === id); if (!e) return;
  const nT = tasksOf(id).length, nA = ATT.filter(a => a.eventId === id).length;
  const ok = await confirmBox({ title: 'Termin löschen?', text: `„${e.title}“ wird gelöscht${nT || nA || S.notes[id] ? ', einschließlich Aufgaben, Notizen und Bildern' : ''}. Das lässt sich kurz danach noch rückgängig machen.`, ok: 'Löschen', danger: true });
  if (!ok) return;
  const snap = { e, i: S.events.indexOf(e), tasks: tasksOf(id), note: S.notes[id], atts: ATT.filter(a => a.eventId === id), pinned: S.settings.pinnedId === id };
  S.events = S.events.filter(x => x.id !== id); S.tasks = S.tasks.filter(t => t.eventId !== id); delete S.notes[id];
  if (snap.atts.length) { ATT = ATT.filter(a => a.eventId !== id); persistAtt(); }
  if (S.settings.pinnedId === id) S.settings.pinnedId = null;
  sheetStack.slice().forEach(r => { if (r.o.eventId === id) closeSheet(r); });
  commit();
  toast('Termin gelöscht', () => {
    S.events.splice(Math.min(snap.i, S.events.length), 0, snap.e); S.tasks.push(...snap.tasks); if (snap.note) S.notes[id] = snap.note;
    if (snap.atts.length) { ATT.push(...snap.atts); persistAtt(); } if (snap.pinned) S.settings.pinnedId = id;
    commit(); toast('Termin wiederhergestellt');
  });
}
function duplicateEvent(id) {
  const e = S.events.find(x => x.id === id); if (!e) return;
  const copy = { ...e, id: uid(), seed: false, title: e.title + ' (Kopie)', completed: false };
  S.events.push(copy);
  commit();
  toast('Termin dupliziert. Passe Datum und Titel an.');
  openEventForm(copy.id);
}

/* ---------- attachments ---------- */
function compressImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const sc = Math.min(1, CONFIG.IMG_MAX_PX / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.max(1, Math.round(img.naturalWidth * sc)), h = Math.max(1, Math.round(img.naturalHeight * sc));
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      try { res(c.toDataURL('image/jpeg', CONFIG.IMG_QUALITY)); } catch (e) { rej(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('decode')); };
    img.src = url;
  });
}
async function addImages(eventId, files) {
  let added = 0;
  for (const f of files) {
    if (!f.type.startsWith('image/')) { toast(`„${f.name}“ ist kein Bild.`); continue; }
    if (f.size > CONFIG.IMG_MAX_SOURCE_MB * 1e6) { toast(`„${f.name}“ ist zu groß (max. ${CONFIG.IMG_MAX_SOURCE_MB} MB).`); continue; }
    try {
      const data = await compressImage(f);
      const a = { id: uid(), eventId, name: f.name.slice(0, 80) || 'Bild', data, size: data.length, created: NOW() };
      ATT.push(a);
      if (!persistAtt()) { ATT.pop(); toast('Der Speicher ist voll. Lösche Bilder oder erstelle ein Backup.'); break; }
      added++;
    } catch (e) { toast(`„${f.name}“ konnte nicht gelesen werden.`); }
  }
  if (added) { commit(); const u = storageUsage(); if (u.ratio >= CONFIG.STORAGE_CRIT) toast('Achtung: Speicher fast voll.'); else if (u.ratio >= CONFIG.STORAGE_WARN) toast('Hinweis: Speicher zu über 60 % belegt.'); }
}
function flushNotes() { if (flushNotes.t) { clearTimeout(flushNotes.t); flushNotes.t = 0; persist(); } }

      <p class="hint">„Schon gewertet“ ist der Anteil der Gesamtnote, der durch bisherige Noten feststeht (z. B. 50 %). Alle Werte kannst du frei ändern.</p></form>
      <div id="c-out" aria-live="polite"></div>
      <button class="btn block" id="c-explain-btn" data-act="calc-explain" aria-expanded="false" hidden>Berechnung erklären</button>
      <div class="explain" id="c-explain" hidden></div></div>`;
    runCalc(rec.body);
  }});
}
function runCalc(root) {
  const out = $('#c-out', root), exBtn = $('#c-explain-btn', root), ex = $('#c-explain', root);
  const A = parseNum($('#c-avg', root).value), T = parseNum($('#c-tgt', root).value), W = parseNum($('#c-known', root).value), w = parseNum($('#c-w', root).value);
  const clear = msg => { out.innerHTML = msg ? `<div class="calc-result"><p style="margin:0">${msg}</p></div>` : ''; exBtn.hidden = true; ex.hidden = true; };
  if (!isNum(A) && !isNum(T)) return clear('Gib deinen aktuellen Durchschnitt und deine Zielnote ein.');
  if (!isNum(A) || A < 1 || A > 6) return clear('Der aktuelle Durchschnitt muss zwischen 1,0 und 6,0 liegen.');
  if (!isNum(T) || T < 1 || T > 6) return clear('Die Zielnote muss zwischen 1,0 und 6,0 liegen.');
  if (!isNum(W) || W < 0 || W > 100) return clear('„Schon gewertet“ muss zwischen 0 und 100 liegen.');
  if (!isNum(w) || w <= 0 || w > 100) return clear('Das Gewicht der nächsten Note muss größer als 0 sein.');
  const r = targetCalc(A, W, T, w);
  let cls = '', big = '', sub = '';
  if (r.kind === 'impossible') { cls = 'bad'; big = 'Dieses Ziel ist mit dieser Gewichtung nicht mehr erreichbar.'; sub = `Selbst mit einer 1,0 kommst du nur auf Ø ${fmtNum(r.best)}.`; }
  else if (r.kind === 'safe') { cls = 'good'; big = 'Du erreichst dein Ziel schon sicher.'; sub = `Selbst mit einer 6,0 bleibst du bei Ø ${fmtNum(r.worst)}.`; }
  else { big = `Du brauchst ungefähr eine ${fmtNum(r.shown, 1)}`; sub = `Eine ${fmtNum(r.shown, 1)} oder besser reicht für Ø ${fmtNum(T)}. Genau gerechnet: ${fmtNum(r.x, 3)}.`; }
  out.innerHTML = `<div class="calc-result ${cls}"><div class="big">${big}</div><p>${sub}</p></div>`;
  exBtn.hidden = false;
  ex.innerHTML = `<b>So wird gerechnet</b><br>Gesuchte Note <code>x</code> aus<br><code>(Ø · W + x · w) / (W + w) = Ziel</code><br>Umgestellt: <code>x = (Ziel · (W + w) − Ø · W) / w</code><br>
    Mit deinen Werten: <code>x = (${fmtNum(T)} · (${fmtNum(W, 0)} + ${fmtNum(w, 0)}) − ${fmtNum(A)} · ${fmtNum(W, 0)}) / ${fmtNum(w, 0)} = ${fmtNum(r.x, 3)}</code><br>
    Gilt <code>x &lt; 1,0</code>, ist das Ziel unerreichbar (es wird nicht auf 1,0 gerundet). Gilt <code>x &gt; 6,0</code>, hast du das Ziel schon sicher. Sonst wird auf eine Stelle abgerundet, damit die Note sicher reicht.`;
}

  if (tasks.length) h += `<h4>Lernaufgaben</h4><ul class="card flush list">${tasks.map(t => { const e = S.events.find(x => x.id === t.eventId); return `<li><button class="mini" data-act="open-event" data-id="${t.eventId}"><span class="chipic" style="--ec:var(--c-green)">${icon(t.done ? 'circle-check' : 'circle')}</span><span class="t"><b>${hl(t.text, q)}</b><span>${e ? esc(e.title) : ''}${t.done ? ' · erledigt' : ''}</span></span></button></li>`; }).join('')}</ul>`;

function openExport() {
  return openSheet({ title: 'Backup erstellen', tall: true, static: true, build: rec => {

function fileName() { return `schulplaner-backup-${todayKey()}.json`; }
async function exShare(rec) {
  const file = new File([rec.json], fileName(), { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Schulplaner Backup' }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  exDownload(rec);
}
function exDownload(rec) {
  try {
    const url = URL.createObjectURL(new Blob([rec.json], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = fileName(); document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('Backup wird geladen. Falls nichts passiert, nutze „Kopieren“.');
  } catch (e) { toast('Download nicht möglich. Nutze „Kopieren“.'); }
}
async function exCopy(rec) {

  catch (e) { const t = $('#ex-text', rec.body); if (t) { t.focus(); t.select(); toast('Text markiert. Jetzt kopieren.'); } else toast('Kopieren nicht möglich. Nutze „Datei laden“.'); }
}
function openImport() {
  return openSheet({ title: 'Backup importieren', tall: true, static: true, build: rec => {
    rec.body.innerHTML = `<div class="stack"><p class="muted">Wähle eine Backup-Datei oder füge den Backup-Text ein. Vor dem Import siehst du eine Zusammenfassung. Es wird nichts ohne Bestätigung verändert.</p>
      <label class="btn block" style="position:relative;cursor:pointer">${icon('upload')}Backup-Datei wählen<input type="file" id="im-file" data-bind="im-file" accept=".json,application/json,text/plain" style="position:absolute;inset:0;opacity:0;width:100%;cursor:pointer" aria-label="Backup-Datei wählen"></label>
      <div class="field"><label for="im-text">oder Backup-Text einfügen</label><textarea class="inp" id="im-text" rows="5" data-bind="im-text" placeholder='{"app":"schulplaner", …}' style="font-family:ui-monospace,monospace;font-size:12px"></textarea></div>
      <button class="btn primary block" data-act="im-check">${icon('shield-check')}Prüfen</button><div id="im-out"></div></div>`;
  }});
}
function parseBackup(text) {
  let o; try { o = JSON.parse(text); } catch (e) { return { error: 'Das ist kein gültiges JSON. Prüfe, ob die Datei vollständig ist.' }; }
  if (!o || typeof o !== 'object' || Array.isArray(o)) return { error: 'Das Format wird nicht erkannt.' };
  if (o.app !== 'schulplaner' && !Array.isArray(o.events)) return { error: 'Das ist kein Schulplaner-Backup.' };
  if (isNum(o.schema) && o.schema > CONFIG.SCHEMA) return { error: 'Dieses Backup stammt aus einer neueren App-Version und kann hier nicht geladen werden.' };
  const st = sanitizeState(migrate(o));
  const att = []; for (const r of Array.isArray(o.attachments) ? o.attachments : []) { const n = normAtt(r); if (n && st.events.some(e => e.id === n.eventId)) att.push(n); }
  if (!st.events.length && !st.grades.length) return { error: 'Das Backup enthält keine Termine oder Noten.' };
  return { st, att, dropped: st.dropped || 0, exportedAt: o.exportedAt };
}
function importSummary(p) {
  return `<div class="card" style="margin-top:8px"><b>Das Backup enthält</b><p class="hint" style="margin-top:6px">${plural(p.st.events.length, 'Termin', 'Termine')} · ${plural(p.st.tasks.length, 'Aufgabe', 'Aufgaben')} · ${plural(Object.keys(p.st.notes).length, 'Notiz', 'Notizen')} · ${plural(p.st.grades.length, 'Note', 'Noten')} · ${plural(p.att.length, 'Bild', 'Bilder')}${p.dropped ? `<br>${plural(p.dropped, 'fehlerhafter Eintrag wird', 'fehlerhafte Einträge werden')} übersprungen.` : ''}${p.exportedAt ? `<br>Erstellt: ${esc(String(p.exportedAt).slice(0, 10))}` : ''}</p></div>
    <p class="hint" style="margin:12px 0 8px"><b>Zusammenführen</b> ergänzt fehlende Einträge und behält deine vorhandenen Daten. <b>Ersetzen</b> ersetzt alle aktuellen Daten durch das Backup. Vorher wird automatisch eine Sicherheitskopie angelegt.</p>
    <div class="btn-row"><button class="btn primary" data-act="im-merge">Zusammenführen</button><button class="btn danger" data-act="im-replace">Ersetzen …</button></div>`;
}
function snapshotNow() { return { S: JSON.parse(JSON.stringify(S)), ATT: ATT.slice() }; }
function restoreSnapshot(sn) { S = sn.S; ATT = sn.ATT; persist(); persistAtt(); applyTheme(); commit(); }
function doMerge(p) {
  const before = snapshotNow();
  lsSet(CONFIG.PRE_KEY, JSON.stringify(S));
  const ids = new Set(S.events.map(e => e.id)); let n = 0;
  p.st.events.forEach(e => { if (!ids.has(e.id)) { S.events.push(e); ids.add(e.id); n++; } });
  const tids = new Set(S.tasks.map(t => t.id)); p.st.tasks.forEach(t => { if (!tids.has(t.id) && ids.has(t.eventId)) S.tasks.push(t); });
  for (const [k, v] of Object.entries(p.st.notes)) if (ids.has(k) && !S.notes[k]) S.notes[k] = v;
  const gids = new Set(S.grades.map(g => g.id)); p.st.grades.forEach(g => { if (!gids.has(g.id)) S.grades.push(g); });
  p.st.subjects.forEach(s => { if (!S.subjects.includes(s)) S.subjects.push(s); });
  const aids = new Set(ATT.map(a => a.id)); p.att.forEach(a => { if (!aids.has(a.id) && ids.has(a.eventId)) ATT.push(a); });
  const ok = persistAtt(); persist();
  closeAllSheets(); commit();
  toast(ok ? `Zusammengeführt: ${plural(n, 'neuer Termin', 'neue Termine')}` : 'Zusammengeführt, aber nicht alle Bilder passten in den Speicher.', () => restoreSnapshot(before));
}
async function doReplace(p) {
  const ok = await confirmBox({ title: 'Alle Daten ersetzen?', text: 'Deine aktuellen Termine, Aufgaben, Notizen, Noten und Bilder werden durch das Backup ersetzt. Eine Sicherheitskopie wird automatisch angelegt.', ok: 'Ersetzen', danger: true });
  if (!ok) return;
  const before = snapshotNow();
  lsSet(CONFIG.PRE_KEY, JSON.stringify(S));
  S = p.st; ATT = p.att;
  const a = persist(), b = persistAtt();
  applyTheme(); closeAllSheets(); commit();
  toast(a && b ? 'Backup wiederhergestellt' : 'Wiederhergestellt, aber der Speicher reicht nicht für alles.', () => restoreSnapshot(before));
}
async function restoreDefaults() {
  const ids = new Set(S.events.map(e => e.id)); const missing = seedEvents().filter(e => !ids.has(e.id));
  if (!missing.length) { toast('Alle Standard-Termine sind bereits vorhanden'); return; }
  const ok = await confirmBox({ title: 'Standard-Termine ergänzen?', text: `${plural(missing.length, 'fehlender Schultermin wird', 'fehlende Schultermine werden')} wieder hinzugefügt. Deine eigenen Termine, Noten und Notizen bleiben unverändert.`, ok: 'Ergänzen' });
  if (!ok) return;
  S.events.push(...missing); commit(); toast(`${plural(missing.length, 'Termin', 'Termine')} ergänzt`);
}
async function resetAll() {
  const ok = await confirmBox({ title: 'Alle Daten zurücksetzen?', text: 'Alle Termine, Aufgaben, Notizen, Noten, Bilder und Einstellungen werden gelöscht. Danach startet die App mit den Standard-Terminen. Das kannst du nur über „Rückgängig“ direkt danach oder ein Backup zurückholen.', ok: 'Alles löschen', danger: true, typed: 'LÖSCHEN' });
  if (!ok) return;
  const before = snapshotNow();
  lsSet(CONFIG.PRE_KEY, JSON.stringify(S));
  lsDel(CONFIG.ATT_KEY);

  applyTheme(); closeAllSheets(); UI.tab = 'home'; render(true);
  toast('Alle Daten zurückgesetzt', () => restoreSnapshot(before));
}

      case 'task-add': {
        const text = $('#ta-text', form).value.trim(), due = $('#ta-due', form).value;
        if (!text) { $('#ta-text', form).focus(); toast('Bitte gib einen Text für die Aufgabe ein.'); break; }
        if (due && !isDateKey(due)) { toast('Das Datum ist ungültig.'); break; }
        S.tasks.push({ id: uid(), eventId: form.dataset.id, text: text.slice(0, 300), done: false, due, created: NOW() });
        commit();
        const t = $('#ta-text'); if (t) t.focus();
        break;
      }
      default: break;
    }
  } catch (err) { console.error(err); toast('Das hat nicht geklappt. Deine Daten sind sicher.'); }
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'tl-q') { UI.filters.q = el.value; const l = $('#tl-list'); if (l) l.innerHTML = timelineList(); return; }
  if (el.id === 'gs-q') { const o = $('#gs-out'); if (o) o.innerHTML = searchResults(el.value); return; }
  const b = el.dataset && el.dataset.bind;
  if (b === 'calc') runCalc(el.closest('.sheet-body'));
  else if (b === 'note') {
    const id = el.dataset.id; if (el.value) S.notes[id] = el.value.slice(0, 20000); else delete S.notes[id];
    clearTimeout(flushNotes.t); flushNotes.t = setTimeout(() => { flushNotes.t = 0; persist(); }, 450);
  }
});
document.addEventListener('change', async e => {
  const el = e.target, b = el.dataset && el.dataset.bind; if (!b) return;
  try {
    switch (b) {
      case 'f-subj': UI.filters.subj = el.value; render(); break;
      case 'f-from': UI.filters.from = el.value; render(); break;
      case 'f-to': UI.filters.to = el.value; render(); break;
      case 's-prio': S.settings.defaultPriority = el.value; commit(); break;
      case 's-remind': S.settings.remind = el.checked; commit(); break;
      case 's-days': S.settings.remindDays = +el.value; commit(); break;
      case 's-notify': {
        if (!el.checked) { S.settings.notify = false; commit(); break; }
        if (!('Notification' in window)) { el.checked = false; toast('Dieser Browser unterstützt keine Mitteilungen.'); break; }
        const p = await Notification.requestPermission();
        S.settings.notify = p === 'granted'; if (p !== 'granted') toast('Mitteilungen wurden nicht erlaubt.');
        commit(); break;
      }
      case 'weight': {
        const v = parseNum(el.value), t = el.dataset.t;
        if (!isNum(v) || v < 0 || v > 1000) { toast('Bitte eine Zahl zwischen 0 und 1000 eingeben.'); el.value = String(S.settings.weights[t]).replace('.', ','); break; }
        S.settings.weights[t] = v; commit(); break;
      }
      case 'g-subject': { const w = $('#g-new-wrap'); w.hidden = el.value !== '__new'; if (!w.hidden) $('#g-new').focus(); break; }
      case 'c-subj': {
        const root = el.closest('.sheet-body'), st = el.value ? subjectStats(el.value) : null;
        if (st && st.count) { $('#c-avg', root).value = String(Math.round(st.weighted * 100) / 100).replace('.', ','); $('#c-known', root).value = st.knownPct; }
        runCalc(root); break;
      }
      case 'att': { const files = Array.from(el.files || []); el.value = ''; if (files.length) await addImages(el.dataset.id, files); break; }
      case 'ex-img': { const rec = topSheetOf(el); rec.incl = el.checked; rec.render(); break; }
      case 'im-file': {
        const f = el.files && el.files[0]; if (!f) break;
        if (f.size > 40e6) { toast('Die Datei ist zu groß.'); break; }
        const text = await f.text(); const rec = topSheetOf(el);
        $('#im-text', rec.body).value = text.length > 400000 ? '' : text;
        const p = parseBackup(text), out = $('#im-out', rec.body);
        if (p.error) { rec.parsed = null; out.innerHTML = `<p class="err" role="alert">${esc(p.error)}</p>`; } else { rec.parsed = p; out.innerHTML = importSummary(p); }
        break;
      }
      default: break;
    }
  } catch (err) { console.error(err); toast('Das hat nicht geklappt. Deine Daten sind sicher.'); }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheetStack.length && !$('.dlg-scrim') && !$('.viewer')) { closeSheet(); return; }
  if (e.key === 'Tab' && sheetStack.length && !$('.dlg-scrim')) {
    const top = sheetStack[sheetStack.length - 1];
    const f = $$('button:not([disabled]),input:not([disabled]):not([type=hidden]),select,textarea,a[href],[tabindex]:not([tabindex="-1"])', top.sheet).filter(x => x.offsetParent !== null || x === document.activeElement);
    if (!f.length) return;
    const i = f.indexOf(document.activeElement);
    if (e.shiftKey && (i <= 0)) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
  }
});

/* ---------- live tick (only clock, hero countdown and open detail countdowns) ---------- */
let lastDay = '', lastRerender = 0;
function tick() {
  try {
    const now = NOW(), t = todayKey(now);
    if (t !== lastDay) { const first = lastDay === ''; lastDay = t; if (!first) { render(); refreshSheets(); } }
    const c = $('#clock'); if (c) c.textContent = clockText(now);
    const h = $('#hero');
    if (h && h.dataset.target) {
      const diff = +h.dataset.target - now;
      if (diff <= 0) { if (now - lastRerender > 900) { lastRerender = now; render(); } }
      else if (h.dataset.mode === 'until') {
        const d = Math.floor(diff / 864e5), hh = Math.floor(diff % 864e5 / 36e5), m = Math.floor(diff % 36e5 / 6e4), s = Math.floor(diff % 6e4 / 1e3);
        const set = (id, v) => { const n = document.getElementById(id); if (n && n.textContent !== v) n.textContent = v; };
        set('cd-d', pad(d)); set('cd-h', pad(hh)); set('cd-m', pad(m)); set('cd-s', pad(s));
      } else {
        const L = document.getElementById('cd-live');
        if (L) { const hh = Math.floor(diff / 36e5), m = Math.floor(diff % 36e5 / 6e4), s = Math.floor(diff % 6e4 / 1e3); L.textContent = `in ${hh} Std ${pad(m)} Min ${pad(s)} Sek`; }
      }
    }
    $$('[data-until]').forEach(n => { const tx = countdownText(+n.dataset.until); if (tx && n.textContent !== tx) n.textContent = tx; });
  } catch (err) { console.error(err); }
  clearTimeout(tick.t);
  tick.t = setTimeout(tick, 1000 - (Date.now() % 1000) + 8);   // aligned to the next full second, so it can not drift
}

function maybeNotify() {
  try {
    if (!S.settings.notify || !('Notification' in window) || Notification.permission !== 'granted') return;
    const today = todayKey(); if (S.settings.lastNotified === today) return;
    const e = S.events.filter(x => isExam(x) && !x.completed && [0, 1].includes(dayDiff(today, x.date))).sort(byStart)[0];
    if (!e) return;
    new Notification(`${e.title} ${relLabel(e, today).toLowerCase()}`, { body: `${progressOf(e.id).open} Lernaufgaben offen`, icon: 'icons/icon-192.png' });
    S.settings.lastNotified = today; persist();
  } catch (err) { /* notifications are optional */ }
}

let errToast = 0;
window.addEventListener('error', () => { if (NOW() - errToast > 8000) { errToast = NOW(); toast('Etwas ist schiefgelaufen. Deine Daten sind sicher.'); } });
window.addEventListener('unhandledrejection', () => { if (NOW() - errToast > 8000) { errToast = NOW(); toast('Etwas ist schiefgelaufen. Deine Daten sind sicher.'); } });

function init() {
  loadAll();
  applyTheme();
  const tabs = [['home', 'Home', 'house'], ['termine', 'Termine', 'calendar-days'], ['lernen', 'Lernen', 'book-open'], ['noten', 'Noten', 'award'], ['mehr', 'Mehr', 'ellipsis']];
  $('#tabbar').innerHTML = `<ul>${tabs.map(([k, l, i]) => `<li><button class="tab" data-act="goto-tab" data-tab="${k}" aria-label="${l}">${icon(i)}<span>${l}</span></button></li>`).join('')}</ul>`;
  lastDay = '';
  render(true);
  tick();
  maybeNotify();
  if (loadInfo.first && storageOK) toast('Willkommen! Die Schultermine 2026/27 sind schon eingetragen.');
  if (loadInfo.corrupt) toast('Gespeicherte Daten waren beschädigt. Die App startet neu, die Rohkopie bleibt erhalten.');
  if (loadInfo.newer) toast('Daten aus neuerer App-Version erkannt. Es wird nichts überschrieben.');
  if (!storageOK) toast('Speichern im Browser ist nicht möglich. Erstelle Backups unter „Mehr“.');
  document.addEventListener('visibilitychange', () => { if (document.hidden) flushNotes(); else tick(); });
  window.addEventListener('pagehide', flushNotes);
  window.addEventListener('pageshow', tick);
  try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); } catch (e) { /* ignore */ }
  try { if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('service-worker.js').catch(() => { }); } catch (e) { /* ignore */ }
}
init();

})();
</script>
